name: Setup scripts env

on:
  pull_request:
    paths:
      - setup_linux.sh
      - setup_mac.sh
      - start_linux.sh
      - start_mac.sh
      - .env.example
      - compose.yaml
      - scripts/check_setup_env.py
      - .github/workflows/setup-scripts-env.yml
  push:
    branches: [main]
    paths:
      - setup_linux.sh
      - setup_mac.sh
      - start_linux.sh
      - start_mac.sh
      - .env.example
      - compose.yaml
      - scripts/check_setup_env.py
      - .github/workflows/setup-scripts-env.yml

jobs:
  setup-scripts-env:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        script: [setup_linux.sh, setup_mac.sh]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Generate .env with Docker stubbed
        run: |
          mkdir -p .ci-bin
          printf '#!/bin/sh\nexit 0\n' > .ci-bin/docker
          chmod +x .ci-bin/docker
          rm -f .env
          printf 'sk-test\nAIza-test\n\n' | PATH="$PWD/.ci-bin:$PATH" bash ./${{ matrix.script }}
          grep -q '^OPENAI_API_KEY=sk-test$' .env
          grep -q '^GEMINI_API_KEY=AIza-test$' .env

      - name: Check generated .env
        run: python3 scripts/check_setup_env.py .env

      - name: Exit non-zero when docker compose fails
        env:
          SETUP_SCRIPT: ${{ matrix.script }}
        run: |
          mkdir -p .ci-bin-fail
          printf '#!/bin/sh\nif [ "$1" = info ]; then exit 0; fi\necho "stub: docker $* failed" >&2\nexit 17\n' > .ci-bin-fail/docker
          chmod +x .ci-bin-fail/docker
          start_script="${SETUP_SCRIPT/setup_/start_}"
          for script in "$SETUP_SCRIPT" "$start_script"; do
            set +e
            out=$(printf 'sk-test\nAIza-test\n\n' | PATH="$PWD/.ci-bin-fail:$PATH" bash "./$script" 2>&1)
            code=$?
            set -e
            echo "$out"
            if [ "$code" -eq 0 ]; then
              echo "::error::$script exited 0 although docker compose failed"
              exit 1
            fi
            if echo "$out" | grep -q -e 'Setup completed!' -e 'is now running!'; then
              echo "::error::$script printed a success message although docker compose failed"
              exit 1
            fi
          done
          # docker compose が成功する場合、start スクリプトは従来どおり exit 0
          PATH="$PWD/.ci-bin:$PATH" bash "./$start_script" </dev/null
