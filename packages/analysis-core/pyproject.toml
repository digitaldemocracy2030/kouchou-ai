[project]
name = "kouchou-ai-analysis-core"
version = "0.2.0"
description = "広聴AI分析パイプラインコア - Broadlistening Analysis Pipeline Core"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0" }
authors = [
    { name = "Digital Democracy 2030", email = "info@example.com" }
]
keywords = ["broadlistening", "analysis", "pipeline", "llm", "clustering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "polars>=1.37.1",
    "numpy>=1.26.0",
    "openai>=1.77.0",
    # services/rate_limit.py が直接 import する。openai 3.x は httpx ではなく httpx2 に依存するので、
    # openai 経由では入らない（#1168）
    "httpx>=0.28.0",
    "tqdm>=4.66.0",
    "pydantic>=2.0.0",
    "tenacity>=9.1.2",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.0",  # For plugin manifest loading
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0.0"]
embeddings = [
    "sentence-transformers>=2.7.0",
    "torch>=2.0.0",
]
clustering = [
    "scikit-learn>=1.5.0",
    "scipy>=1.15.1",
    "umap-learn>=0.5.7",
    "numba>=0.59.0",  # Ensure Python 3.12 compatible version
]
full = [
    "kouchou-ai-analysis-core[gemini,embeddings,clustering]",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/digitaldemocracy2030/kouchou-ai"
Repository = "https://github.com/digitaldemocracy2030/kouchou-ai"
Documentation = "https://digitaldemocracy2030.github.io/kouchou-ai/user-guide/cli-quickstart.html"
Issues = "https://github.com/digitaldemocracy2030/kouchou-ai/issues"

[project.scripts]
kouchou-analyze = "analysis_core.__main__:main"
kouchou-translate = "analysis_core.translate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analysis_core"]

[tool.hatch.build.targets.wheel.force-include]
"LICENSE" = "analysis_core/steps/AGPL-3.0.txt"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Exclude e2e tests from automatic runs (they require API KEY and cost money)
# Run e2e tests explicitly: OPENAI_API_KEY=xxx pytest tests/e2e/ -v
norecursedirs = ["tests/e2e"]
markers = [
    "e2e: end-to-end tests requiring real API calls (not run by default)",
]
