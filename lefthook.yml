pre-push:
  parallel: true
  commands:
    client-lint:
      root: "apps/public-viewer/"
      glob: "apps/public-viewer/**/*.{js,mjs,jsx,ts,tsx,json}"
      run: "npx biome check {push_files}"
      skip: true
    client-admin-lint:
      root: "apps/admin/"
      glob: "apps/admin/**/*.{js,mjs,jsx,ts,tsx,json}"
      run: "npx biome check {push_files}"
      skip: true
    dummy-server-lint:
      root: "utils/dummy-server/"
      glob: "utils/dummy-server/**/*.{js,mjs,jsx,ts,tsx,json}"
      exclude: "hierarchical_result.json"
      run: "npx biome check {push_files}"
      skip: true
    # rye / PATH 上の ruff / uvx の順に探して実行する。どれも無ければ警告して飛ばす（scripts/lefthook-api-ruff.sh）
    api-ruff-check:
      root: "apps/api/"
      glob: "apps/api/**/*.py"
      run: "sh ../../scripts/lefthook-api-ruff.sh check ."
    api-ruff-format:
      root: "apps/api/"
      glob: "apps/api/**/*.py"
      run: "sh ../../scripts/lefthook-api-ruff.sh format . --check"
