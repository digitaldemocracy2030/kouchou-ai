site_name: 広聴AI Documentation
site_description: デジタル民主主義2030プロジェクト - ブロードリスニングシステム
site_url: https://digitaldemocracy2030.github.io/kouchou-ai/
repo_url: https://github.com/digitaldemocracy2030/kouchou-ai
repo_name: digitaldemocracy2030/kouchou-ai

# Hooks for copying root-level markdown files
hooks:
  - scripts/docs_hooks.py

theme:
  name: material
  language: ja
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替え
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search:
      lang: ja
  - offline
  # getting-started/ を self-hosting/ に改称した際の旧 URL 救済（#876）。
  # 旧パスへアクセスすると新パスへリダイレクトする。
  - redirects:
      redirect_maps:
        getting-started/quickstart.md: self-hosting/quickstart.md
        getting-started/windows-setup.md: self-hosting/windows-setup.md
        getting-started/mac-setup.md: self-hosting/mac-setup.md
        getting-started/linux-setup.md: self-hosting/linux-setup.md

not_in_nav: |
  /refactoring/**
  /misc/github-actions-status-update.md

# nav に未登録のページを CI (mkdocs build --strict) で検知する。
# not_in_nav で意図的に除外したページは警告されない。
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

nav:
  - ホーム: index.md
  - セルフホスト（自分で環境を建てる）:
      - クイックスタート: self-hosting/quickstart.md
      - Windowsセットアップ: self-hosting/windows-setup.md
      - Macセットアップ: self-hosting/mac-setup.md
      - Linuxセットアップ: self-hosting/linux-setup.md
      - セキュリティ情報:
          - 「APIキー」欄のキーの書き出し（v4.2.0 で修正）: self-hosting/security/user-api-key-leak-2026-10.md
  - ユーザーガイド:
      - 始め方の選び方: user-guide/choosing-how-to-start.md
      - レポートの読み方: user-guide/report-reading-guide.md
      - 導入を検討する方へ: user-guide/adoption-guide.md
      - 使い方: user-guide/how-to-use.md
      - レポート作成者情報の設定: user-guide/metadata-setup.md
      - 濃いクラスタの初期値: user-guide/density-settings.md
      - レポート再利用: user-guide/reuse-report.md
      - ライセンスと結果の公開: user-guide/license.md
      - 結果の信頼性と責任の所在: user-guide/reliability-and-responsibility.md
      - CLIクイックスタート: user-guide/cli-quickstart.md
      - Python API からの利用: user-guide/import-quickstart.md
      - FAQ: user-guide/faq.md
  - 開発者向け:
      - コントリビューション: development/contributing.md
      - CIの静的サイトを確認する: development/static-preview.md
      - shell配布物の組み立て: development/static-shell-export.md
      - レポート整合性検査: development/output-validation.md
      - AIエージェントの作業導線: development/ai-assistants.md
      - LLMタイムアウト設定: development/llm-timeout.md
      - ローカルLLMの認証付きゲートウェイ: development/local-llm-gateway.md
      - 狭い画面での閲覧: development/mobile-reading.md
      - 抽出プロンプトの調整: development/extraction-prompts.md
      - 抽出失敗の診断: development/extraction-diagnostics.md
      - 管理画面のレポート取得失敗: development/admin-report-fetch-troubleshooting.md
      - npmではなくpnpmを使う理由: development/why-pnpm.md
      - プラグインガイド: development/plugin-guide.md
      - プラグイン出力データ構造: development/plugin-output-data-structures.md
      - プラグインシステムの設計思想: development/why-plugin-system.md
      - PyPI公開: development/pypi-release.md
      - コードレビューガイドライン: development/code-review-guidelines.md
      - Devinとの協働: development/devin-collaboration.md
      - Windows 実機セットアップ検証: development/windows-real-machine-setup-verification.md
      - モデル一覧・検証状態・料金の更新: development/model-catalog.md
      - OpenAI Flex Processing: development/openai-flex-processing.md
      - 意見の分類ラベル: development/opinion-classification.md
      - 関連研究（本体未収録の実験的手法）: development/related-research.md
      - Web UI の Node runtime 依存インベントリ（監査スナップショット/#885）: development/web-ui-node-runtime-dependencies.md
  - リポジトリ内README:
      - アプリ:
          - admin: repo-readmes/apps/admin.md
          - api: repo-readmes/apps/api.md
          - api/broadlistening: repo-readmes/apps/api-broadlistening.md
          - public-viewer: repo-readmes/apps/public-viewer.md
      - パッケージ:
          - analysis-core: repo-readmes/packages/analysis-core.md
      - テスト:
          - e2e: repo-readmes/tests/e2e.md
          - fixtures/client: repo-readmes/tests/e2e-fixtures-client.md
      - ツール:
          - tools/scripts: repo-readmes/tools/scripts.md
      - ユーティリティ:
          - dummy-server: repo-readmes/utils/dummy-server.md
      - 実験:
          - experiments: repo-readmes/experiments/index.md
          - Windows 非Docker セットアップ (direct_win): repo-readmes/experiments/direct-win.md
          - embvec_reduce_public_comment: repo-readmes/experiments/embvec-reduce-public-comment.md
          - evaluation_report: repo-readmes/experiments/evaluation-report.md
  - デプロイ:
      - Azure デプロイ: deployment/azure.md
      - Azure Blob Storage: deployment/azure-blob-storage.md
      - GitHub Pages: deployment/github-pages.md
      - 静的ホスティング向け CSP 設定: deployment/static-hosting-csp.md
      - ストレージスナップショット運用: deployment/storage-snapshot-operations.md
  - その他:
      - 開発ボード運用ポリシー: misc/projects.md
      - CLA: misc/cla.md
      - テスト: testing.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/digitaldemocracy2030/kouchou-ai
