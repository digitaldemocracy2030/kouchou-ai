x-frontend-common: &frontend-common
  depends_on:
    api:
      condition: service_healthy
  env_file:
    - .env
  restart: unless-stopped
  networks:
    - app-network
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-frontend-build-args: &frontend-build-args
  args:
    - NEXT_PUBLIC_API_BASEPATH=${NEXT_PUBLIC_API_BASEPATH}
    - API_BASEPATH=${API_BASEPATH}
    - NEXT_PUBLIC_PUBLIC_API_KEY=${NEXT_PUBLIC_PUBLIC_API_KEY}
    - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
    # CSP はビルド時に決まるので、GA を使うならビルド時にも渡す
    - NEXT_PUBLIC_GA_MEASUREMENT_ID=${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}

services:
  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
      args:
        - ENVIRONMENT=${ENVIRONMENT}
        - WITH_GPU=${WITH_GPU:-false}
    ports:
      # 既定ではホストのループバック（127.0.0.1）だけに公開し、同じ LAN の他の端末からは接続できないようにする
      # 他の端末から接続させたい場合だけ .env の HOST_BIND_ADDRESS を変える（admin の BASIC_AUTH_* も設定すること）
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    volumes:
      - ./apps/api:/app
    environment:
      - LOG_LEVEL=debug
      - NUMBA_CPU_NAME=${NUMBA_CPU_NAME:-generic}
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - app-network

  public-viewer:
    <<: *frontend-common
    build:
      context: .
      dockerfile: ./apps/public-viewer/Dockerfile
      <<: *frontend-build-args
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:3000:3000"

  static-site-builder:
    <<: *frontend-common
    build:
      context: .
      dockerfile: ./apps/static-site-builder/Dockerfile
      <<: *frontend-build-args

  admin:
    <<: *frontend-common
    build:
      context: .
      dockerfile: ./apps/admin/Dockerfile
      args:
        - NEXT_PUBLIC_CLIENT_BASEPATH=${NEXT_PUBLIC_CLIENT_BASEPATH}
        - NEXT_PUBLIC_API_BASEPATH=${NEXT_PUBLIC_API_BASEPATH}
        - NEXT_PUBLIC_ADMIN_API_KEY=${NEXT_PUBLIC_ADMIN_API_KEY}
        - API_BASEPATH=http://api:8000
        - CLIENT_STATIC_BUILD_BASEPATH=${CLIENT_STATIC_BUILD_BASEPATH}
        - NEXT_PUBLIC_ADMIN_GA_MEASUREMENT_ID=${NEXT_PUBLIC_ADMIN_GA_MEASUREMENT_ID:-}
        # 作成フォームの初期値（LocalLLM のアドレス・既定のプロバイダー）はビルド時に埋め込まれる
        - NEXT_PUBLIC_LOCAL_LLM_ADDRESS=${NEXT_PUBLIC_LOCAL_LLM_ADDRESS:-ollama:11434}
        - NEXT_PUBLIC_USE_AZURE=${NEXT_PUBLIC_USE_AZURE:-}
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:4000:4000"
    environment:
      - API_BASEPATH=http://api:8000

  ollama:
    image: ollama/ollama:latest
    ports:
      # ホスト側のポート。ホストで別の Ollama が 11434 を使っている場合は .env の OLLAMA_HOST_PORT で変える
      # （アプリはコンテナ間通信の ollama:11434 で接続するため、この値を変えてもアプリ側の設定は不要）
      # Ollama の API には認証がないので、HOST_BIND_ADDRESS とは別に OLLAMA_HOST_BIND_ADDRESS で公開範囲を決める（既定はループバック）
      - "${OLLAMA_HOST_BIND_ADDRESS:-127.0.0.1}:${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    networks:
      - app-network
    profiles:
      - ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # ollama イメージのデフォルトエントリーポイントを上書きして、モデルを自動ダウンロード
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        sleep 10
        ollama pull hf.co/elyza/Llama-3-ELYZA-JP-8B-GGUF
        tail -f /dev/null

networks:
  app-network:
    driver: bridge

volumes:
  ollama-data:
    driver: local
